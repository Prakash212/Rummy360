<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 170 235">

  <defs>

    <!-- Card Body -->
    <linearGradient id="cardBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F8F8"/>
    </linearGradient>

    <!-- Gold Border -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="45%" stop-color="#E9C455"/>
      <stop offset="100%" stop-color="#C38A13"/>
    </linearGradient>

    <!-- Card Gloss -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Premium Spade -->
    <radialGradient id="spadeFill" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="45%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <linearGradient id="spadeShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- Soft Shadow -->
  <rect x="8" y="9"
        width="154"
        height="219"
        rx="18"
        fill="#000000"
        opacity="0.05"/>

  <!-- Main Card -->
  <rect x="5" y="5"
        width="160"
        height="225"
        rx="18"
        fill="url(#cardBody)"
        stroke="url(#goldBorder)"
        stroke-width="2"/>

  <!-- Inner Border -->
  <rect x="13" y="13"
        width="144"
        height="209"
        rx="14"
        fill="none"
        stroke="#EFE5BE"
        stroke-width="1"/>

  <!-- Top Gloss -->
  <path d="M20 22
           Q85 6 150 22
           L150 92
           Q85 74 20 92 Z"
        fill="url(#gloss)"/>

  <!-- Bottom Light -->
  <path d="M20 188
           Q85 205 150 188
           L150 214
           Q85 223 20 214 Z"
        fill="#FFFFFF"
        opacity="0.12"/>

  <!-- Edge Highlights -->
  <path d="M18 20 V205"
        stroke="#FFFFFF"
        stroke-width="1"
        opacity="0.45"/>

  <path d="M150 20 V205"
        stroke="#D8D8D8"
        stroke-width="1"
        opacity="0.35"/>

  <!-- ===== TOP LEFT A ===== -->
  <text x="20"
        y="30"
        font-family="Georgia"
        font-size="21"
        font-weight="700"
        fill="#111111">A</text>

  <!-- Small Spade aligned under A -->
  <g transform="translate(20,36) scale(0.15)">
    <path fill="url(#spadeFill)"
          d="M64 10 C78 24 95 40 104 54 C111 64 112 76 106 86 C100 97 90 103 78 103 C71 103 66 100 64 95 C62 100 57 103 50 103 C38 103 28 97 22 86 C16 76 17 64 24 54 C33 40 50 24 64 10 Z"/>
    <rect x="58" y="92" width="12" height="18" rx="4" fill="#050505"/>
    <path fill="url(#spadeFill)"
          d="M64 108 C56 116 47 120 38 120 C46 112 54 106 64 104 C74 106 82 112 90 120 C81 120 72 116 64 108 Z"/>
  </g>

  <!-- ===== CENTER PREMIUM SPADE ===== -->
  <g transform="translate(36,48) scale(0.70)">

    <path fill="url(#spadeFill)"
          d="M64 10
             C78 24 95 40 104 54
             C111 64 112 76 106 86
             C100 97 90 103 78 103
             C71 103 66 100 64 95
             C62 100 57 103 50 103
             C38 103 28 97 22 86
             C16 76 17 64 24 54
             C33 40 50 24 64 10 Z"/>

    <rect x="58"
          y="92"
          width="12"
          height="18"
          rx="4"
          fill="#050505"/>

    <path fill="url(#spadeFill)"
          d="M64 108
             C56 116 47 120 38 120
             C46 112 54 106 64 104
             C74 106 82 112 90 120
             C81 120 72 116 64 108 Z"/>

    <!-- Gloss -->
    <path fill="url(#spadeShine)"
          opacity="0.45"
          d="M64 18
             C72 28 82 38 88 48
             C79 42 69 39 58 39
             C50 39 43 42 38 46
             C44 36 54 26 64 18 Z"/>

  </g>

  <!-- ===== BOTTOM RIGHT (UPSIDE DOWN) ===== -->
  <g transform="translate(150,205) rotate(180)">

    <text x="20"
          y="30"
          font-family="Georgia"
          font-size="21"
          font-weight="700"
          fill="#111111">A</text>

    <g transform="translate(20,36) scale(0.15)">
      <path fill="url(#spadeFill)"
            d="M64 10 C78 24 95 40 104 54 C111 64 112 76 106 86 C100 97 90 103 78 103 C71 103 66 100 64 95 C62 100 57 103 50 103 C38 103 28 97 22 86 C16 76 17 64 24 54 C33 40 50 24 64 10 Z"/>
      <rect x="58" y="92" width="12" height="18" rx="4" fill="#050505"/>
      <path fill="url(#spadeFill)"
            d="M64 108 C56 116 47 120 38 120 C46 112 54 106 64 104 C74 106 82 112 90 120 C81 120 72 116 64 108 Z"/>
    </g>

  </g>

</svg>