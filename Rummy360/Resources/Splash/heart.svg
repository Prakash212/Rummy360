           C68 24 75 20 84 20
           C101 20 114 33 114 50
           C114 68 103 82 86 96
           C79 102 72 108 64 116 Z"/>

  <!-- Top glossy shine -->
  <path fill="url(#shine)"
        opacity="0.45"
        d="M64 28
           C72 24 80 23 87 26
           C92 29 96 34 98 40
           C90 37 82 36 74 39
           C68 41 62 46 58 52
           C54 44 46 39 38 37
           C44 30 53 26 64 28 Z"/>

  <!-- Left highlight -->
