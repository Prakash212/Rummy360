           cy="48"
           rx="8"
           ry="5"
           fill="#FFFFFF"
           opacity="0.10"/>

  <!-- Bottom soft highlight -->
  <path fill="#FFFFFF"
        opacity="0.08"
        d="M64 108
           C56 101 49 96 43 91
           C50 95 57 98 64 98
           C71 98 78 95 85 91
           C79 96 72 101 64 108 Z"/>

