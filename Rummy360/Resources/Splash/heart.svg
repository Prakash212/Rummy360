<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128">

  <defs>

    <!-- Premium red gradient -->
    <radialGradient id="heartFill" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#FF8E8E"/>
      <stop offset="30%" stop-color="#FF5A5A"/>
      <stop offset="65%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#B3122D"/>
    </radialGradient>

    <!-- Gloss highlight -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- Heart -->
  <path fill="url(#heartFill)"
