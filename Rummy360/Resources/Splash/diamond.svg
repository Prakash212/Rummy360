<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128">

  <defs>

    <!-- Ruby red gradient -->
    <radialGradient id="diamondFill" cx="38%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#FF9A9A"/>
      <stop offset="35%" stop-color="#FF5252"/>
      <stop offset="70%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#A9112B"/>
    </radialGradient>

    <!-- Gloss -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- Diamond -->
  <path fill="url(#diamondFill)"
        d="M64 10
           L108 64
           L64 118
           L20 64 Z"/>

  <!-- Top glossy highlight -->
  <path fill="url(#shine)"
        opacity="0.40"
        d="M64 18
           L94 56
           L64 46
           L34 56 Z"/>

  <!-- Center bevel -->
  <path fill="#FFFFFF"
        opacity="0.14"
        d="M64 18
           L74 64
           L64 108
           L54 64 Z"/>

  <!-- Left highlight -->
  <path fill="#FFFFFF"
        opacity="0.08"
        d="M32 60
           L64 28
           L58 64
           L64 100 Z"/>

  <!-- Bottom highlight -->
  <path fill="#FFFFFF"
        opacity="0.10"
        d="M38 70
           L64 104
           L90 70
           L64 86 Z"/>

</svg>