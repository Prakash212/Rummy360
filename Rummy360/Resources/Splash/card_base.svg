<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 235" width="170" height="235">
  <defs>
    <!-- White card body -->
    <linearGradient id="cardBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F8F8"/>
    </linearGradient>

    <!-- Gold border -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="45%" stop-color="#E9C455"/>
      <stop offset="100%" stop-color="#C38A13"/>
    </linearGradient>

    <!-- Inner shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <!-- Gloss highlight -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- Card Shadow -->
  <rect x="8" y="8" width="154" height="219" rx="18" fill="#000000" opacity="0.06"/>
  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="5" y="5" width="160" height="225" rx="18" fill="url(#cardBody)" stroke="url(#goldBorder)" stroke-width="2"/>
    <!-- Inner Border -->
    <rect x="13" y="13" width="144" height="209" rx="14" fill="none" stroke="#EFE5BE" stroke-width="1"/>
    <!-- Top Gloss -->
    <path d="M20 22
             Q85 6 150 22
             L150 92
             Q85 74 20 92 Z"
          fill="url(#gloss)"/>

    <!-- Bottom Soft Light -->
    <path d="M20 188
             Q85 205 150 188
             L150 214
             Q85 223 20 214 Z"
          fill="#FFFFFF"
          opacity="0.12"/>

    <!-- Edge Highlights -->
    <path d="M18 20 V205"
          stroke="#FFFFFF"
          stroke-width="1"
          opacity="0.45"/>

    <path d="M150 20 V205"
          stroke="#D8D8D8"
          stroke-width="1"
          opacity="0.35"/>

  </g>

</svg>